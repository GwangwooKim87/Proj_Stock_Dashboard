<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{ color-scheme: dark;}
  *{ box-sizing:border-box; }
  body{ font-family: system-ui, sans-serif; background:#0f1115; color:#e8e8e8; margin:0; padding:16px; max-width:960px; margin:0 auto;}
  h1{ font-size:20px; margin:8px 0 2px;}
  .muted{ color:#9aa0aa; font-size:13px;}
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin:16px 0;}
  .card{ background:#1a1d24; border:1px solid #2a2e38; border-radius:12px; padding:14px; }
  .card b{ font-size:15px; display:block; margin-bottom:4px;}
  .sum{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0;}
  .sum .card b{ font-size:20px; }
  .pos{ width:100%; font-size:13px; border-collapse:collapse;}
  .pos th,.pos td{ text-align:left; padding:8px 6px; border-bottom:1px solid #22262f;}
  .pos th{ color:#9aa0aa; font-weight:600;}
  .pos .num{ text-align:right; font-variant-numeric:tabular-nums;}
  .red{ color:#ff5c5c;} .green{ color:#4ade80;}
  .tag{ display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:#252a35; color:#9aa0aa; margin-left:6px;}
  .st{margin:4px 0;}
</style>
</head>
<body>
  <h1>Stock Dashboard</h1>
  <div class="muted" id="meta">loading health...</div>

  <div class="sum" id="summary"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;">
    <div class="card"><b>종목별 평가금액 비중</b><div id="donutItem" style="height:260px;"></div></div>
    <div class="card"><b>원화 vs 외화 비중</b><div id="donutCcy" style="height:260px;"></div></div>
  </div>
  <div class="cards" id="accts"></div>
  <div class="card" id="status">Loading...</div>

  <table class="pos" id="pos">
    <thead><tr><th>브로커</th><th>종목</th><th>수량</th><th>현재가</th><th>평단가</th><th>통화</th><th>평가손익</th><th>수익률</th></tr></thead>
    <tbody id="posbody"></tbody>
  </table>

  <script>
    const $=id=>document.getElementById(id);
    const fmt=(n,cur='')=>{ if(n===void 0||n===null)return '-'; const s=Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2}); return cur? s+' '+cur : s; };

    fetch('/health').then(r=>r.json()).then(d=>{$('meta').textContent='db: '+d.db}).catch(()=>{});

    fetch('/api/accounts').then(r=>r.json()).then(d=>{
      const el=$('accts');
      el.innerHTML=(d.accounts||[]).map(a=>'<div class="card"><b>'+a.label+'</b><div class="st"><span class="muted">계좌번호: </span>'+a.account_no+'</div><div class="tag">통화 '+a.currency_base+' · '+a.broker+'</div></div>').join('') || '<div class="card muted">계좌 없음</div>';
    }).catch(e=>{$('status').innerHTML='<b>Status:</b> error: '+e});

    fetch('/api/portfolio').then(r=>r.json()).then(d=>{
      const items=d.holdings||[];
      let totalKrw=0, totalUsd=0;
      items.forEach(h=>{
        const mv=h.qty*h.cur_price;
        if(h.currency==='USD') totalUsd+=mv; else totalKrw+=mv;
      });
      $('summary').innerHTML=
        '<div class="card"><span class="muted">보유 종목</span><b>'+items.length+'</b></div>'+
        '<div class="card"><span class="muted">원화 평가</span><b>'+fmt(totalKrw,'원')+'</b></div>'+
        '<div class="card"><span class="muted">외화 평가</span><b>'+fmt(totalUsd,'$')+'</b></div>';

      // 도넛 1: 종목별 평가금액 비중
      if (window.echarts && $('donutItem')) {
        const nameMap={};
        const byName={};
        items.forEach(h=>{ const k=(h.name||h.symbol); byName[k]=(byName[k]||0)+h.qty*h.cur_price; });
        const itemDonut=echarts.init($('donutItem'));
        const itemSort=Object.entries(byName).sort((a,b)=>b[1]-a[1]);
        itemDonut.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}'},legend:{textStyle:{color:'#9aa0aa'},type:'scroll',bottom:0},
          series:[{type:'pie',radius:['45%','70%'],center:['50%','42%'],avoidLabelOverlap:true,
            label:{color:'#e8e8e8',formatter:'{b}: {d}%'},data:itemSort.map(([n,v])=>({name:n,value:Math.round(v)}))}]});
        window._d1=itemDonut;
      }

      // 도넛 2: 원화 vs 외화 비중
      if (window.echarts && $('donutCcy')) {
        const ccDonut=echarts.init($('donutCcy'));
        ccDonut.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}'},legend:{textStyle:{color:'#9aa0aa'},bottom:0},
          series:[{type:'pie',radius:['45%','70%'],center:['50%','42%'],label:{color:'#e8e8e8',formatter:'{b}: {d}%'},
            data:[{name:'원화 (KRW)',value:Math.round(totalKrw)},{name:'외화 (USD)',value:Math.round(totalUsd)}]}]});
        window._d2=ccDonut;
      }

      $('posbody').innerHTML=items.map(h=>{
        const pnlCls = h.p_pnl > 0 ? 'green' : (h.p_pnl < 0 ? 'red' : '');
        const rateCls = h.p_pnl_rate > 0 ? 'green' : (h.p_pnl_rate < 0 ? 'red' : '');
        return '<tr><td>'+h.broker+'</td><td>'+h.name+'<span class="tag">'+h.symbol+'</span></td>'+
        '<td class="num">'+fmt(h.qty)+'</td><td class="num">'+fmt(h.cur_price)+'</td>'+
        '<td class="num">'+fmt(h.avg_price)+'</td><td>'+h.currency+'</td>'+
        '<td class="num '+pnlCls+'">'+fmt(h.p_pnl)+'</td>'+
        '<td class="num '+rateCls+'">'+(h.p_pnl_rate!=null?h.p_pnl_rate.toFixed(2)+'%':'-')+'</td></tr>';}).join('');
      $('status').innerHTML='<b>Status:</b> healthy · 종목 '+items.length+' · 저장 '+d.saved;
    }).catch(e=>{$('status').innerHTML='<b>Status:</b> error: '+e});
  </script>
</body>
</html>
